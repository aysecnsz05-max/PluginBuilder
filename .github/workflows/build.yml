
name: Plugin Builder

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract ZIPs
        run: |
          mkdir -p projects
          for f in *.zip; do
            [ -f "$f" ] || continue
            name="${f%.zip}"
            mkdir -p "projects/$name"
            unzip -q "$f" -d "projects/$name"
          done

      - name: Build plugins
        run: |
          find projects -type f -name gradlew -exec chmod +x {} \;
          find projects -type f -name gradlew -execdir bash -c './gradlew build --no-daemon' \;
          find projects -type f -name mvnw -exec chmod +x {} \;
          find projects -type f -name mvnw -execdir bash -c './mvnw package -DskipTests' \;

      - name: Collect JARs
        run: |
          mkdir -p output
          find projects -type f -path '*/build/libs/*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -exec cp {} output/ \;
          find projects -type f -path '*/target/*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -exec cp {} output/ \;

      - name: Upload JARs
        uses: actions/upload-artifact@v4
        with:
          name: Plugin-JARs
          path: output/*.jar
          
